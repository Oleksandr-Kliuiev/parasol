# Atlas on the VPS (docs/deploy/DEPLOY.md). Run from the checkout: docker compose -f deploy/compose.yaml -p atlas-admin …
# Secrets live in /etc/atlas-admin (root, 0600); every container gets only its own env file. The database has no published port.
name: atlas-admin
services:
  db:
    image: postgres:17.6-bookworm
    container_name: atlas-admin-db
    env_file: /etc/atlas-admin/db.env
    environment: { POSTGRES_DB: atlas }
    volumes: [atlas-admin-pgdata:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
  api:
    image: atlas-admin:latest
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: atlas-admin-api
    env_file: /etc/atlas-admin/api.env
    environment: { ATLAS_MODE: db, ATLAS_LISTEN_HOST: 0.0.0.0, ATLAS_API_PORT: "3100", ATLAS_OPERATOR_UI: "1",
      ATLAS_ALLOWED_HOSTS: "admin.vardahei.tech,atlas-admin-api:3100", ATLAS_DECISIONS_MODE: rules }
    depends_on: [db]
    networks: [internal, edge]
    restart: unless-stopped
  oauth2:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: atlas-admin-oauth2
    env_file: /etc/atlas-admin/oauth2.env
    networks: [edge]
    restart: unless-stopped
  scheduler:
    image: atlas-admin:latest
    container_name: atlas-admin-scheduler
    command: ["node", "--experimental-strip-types", "--no-warnings", "scripts/scheduler.ts"]
    env_file: /etc/atlas-admin/scheduler.env
    # Decisions stay rules-only: no paid model call is admitted (config/decisions.json defaults to shadow).
    environment: { ATLAS_DECISIONS_MODE: rules }
    depends_on: [api]
    networks: [internal]
    restart: unless-stopped
  admin:
    image: atlas-admin:latest
    profiles: [tools]
    user: root
    volumes: ["/etc/atlas-admin:/secrets"]
    networks: [internal]
networks:
  internal: {}
  edge: { external: true, name: atlas_edge }
volumes:
  atlas-admin-pgdata: {}
