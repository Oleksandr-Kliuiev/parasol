name: Parasol CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parasol-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  history:
    name: History and build tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm run check:history
      - run: node --test scripts/*.test.mjs
      - run: npm run test:harness:unit

  atlas:
    name: Atlas Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json
      - run: npm ci --prefix apps/atlas
      - run: npm run build:atlas
      - run: npm run check:atlas

  atlas-integration:
    name: Atlas complete tests (no skips)
    # The inherited peer-credential and F_FULLFSYNC contracts require native Darwin/arm64.
    # Linux production builds are validated independently by the atlas job above.
    runs-on: macos-15
    timeout-minutes: 150
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json
      - run: npm ci --prefix apps/atlas
      - run: npm run build:atlas
      - run: npm run test:atlas
      - name: Install test database runtime
        run: brew install postgresql@17
      - name: Start disposable native PostgreSQL
        run: node scripts/atlas-postgres.mjs start
      - run: npm run db:check:pg17 --prefix apps/atlas
      - run: npm run db:check:drift --prefix apps/atlas
      - name: Every PostgreSQL test, including native chain and paced 200-case rehearsal
        run: npm run test:atlas:pg
      - run: npx playwright install chromium
        working-directory: apps/atlas
      - name: Every browser test, including the paced 200-case journey
        run: npm run test:atlas:ui
      - name: Stop disposable PostgreSQL
        if: ${{ always() }}
        run: node scripts/atlas-postgres.mjs stop

  crm-backend:
    name: CRM backend and SQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: apps/crm/global.json
      - run: dotnet restore Vardahei.Crm.slnx
      - run: dotnet build Vardahei.Crm.slnx --no-restore -c Release
        id: build
      - name: Dependency audit
        run: |
          dotnet list Vardahei.Crm.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vulnerable.json"
          python3 tools/release/release.py vulnerable-dotnet "$RUNNER_TEMP/vulnerable.json" --min-projects "$(grep -c '<Project ' Vardahei.Crm.slnx)"
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test --project tests/Crm.UnitTests/Crm.UnitTests.csproj --no-build -c Release
          --coverage --coverage-output-format cobertura --coverage-output "$RUNNER_TEMP/coverage/unit.cobertura.xml"
      - name: Architecture tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/Crm.ArchitectureTests/Crm.ArchitectureTests.csproj --no-build -c Release
      - name: SQL Server and storage integration (local containers)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test --project tests/Crm.IntegrationTests/Crm.IntegrationTests.csproj --no-build -c Release
          --coverage --coverage-output-format cobertura --coverage-output "$RUNNER_TEMP/coverage/integration.cobertura.xml"
      - name: Coverage gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          python3 tools/coverage/coverage-gate.py --allow-unmeasured Crm.Worker --summary "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/coverage/unit.cobertura.xml" "$RUNNER_TEMP/coverage/integration.cobertura.xml"

  crm-frontend:
    name: CRM frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/crm/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/crm/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: node --experimental-vm-modules --test ../tools/load-test/*.test.mjs
      - run: npm run build
      - run: npm audit --audit-level=high

  crm-e2e:
    name: CRM browser workflows
    runs-on: ubuntu-24.04
    # Three engines with one retry ran 28 minutes in October 2026; the job was cancelled at 30 just after the last test.
    timeout-minutes: 45
    needs: [crm-backend, crm-frontend]
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Local_Dev_Passw0rd!
        ports: ['14333:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Local_Dev_Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: apps/crm/global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/crm/web/package-lock.json
      - run: npm ci --prefix apps/crm/web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/crm/web
      - run: dotnet dev-certs https
      - run: npm run test:crm:e2e

  hostinger:
    name: Hostinger images and real backup restore
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deployment failure and isolation tests
        run: python3 -m unittest discover -s deploy/hostinger/tests -v
      - name: Build images, migrate both databases, backup and restore into a fresh isolated stack
        run: >-
          sudo env PARASOL_REHEARSAL_DIAGNOSTICS=1 python3 deploy/hostinger/rehearse.py
          --directory "$RUNNER_TEMP/parasol-rehearsal" --release ci-${{ github.sha }}
      - name: Publish only the secret-free synthetic drill report
        run: sudo cat "$RUNNER_TEMP/parasol-rehearsal/report.json" | tee -a "$GITHUB_STEP_SUMMARY"

  required:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [history, atlas, atlas-integration, crm-backend, crm-frontend, crm-e2e, hostinger]
    steps:
      - name: All checks must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = [name for name, job in results.items() if job['result'] != 'success']
          if failures:
              raise SystemExit('Unsuccessful checks: ' + ', '.join(failures))
          print('All Parasol checks passed, including complete Atlas suites with no failure or skip exceptions.')
          PY
