name: Deploy

# test: every push to main. prod: manual run, gated by the "prod" GitHub Environment (required reviewers).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, prod]
        default: test

permissions:
  id-token: write # OIDC federation to Azure, no stored credentials
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'test' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'test' }}
      RESOURCE_GROUP: rg-crm-${{ inputs.environment || 'test' }}
      CRM_IMAGE_TAG: ${{ github.sha }}
      CRM_ENTRA_TENANT_ID: ${{ vars.CRM_ENTRA_TENANT_ID }}
      CRM_ENTRA_CLIENT_ID_TEST: ${{ vars.CRM_ENTRA_CLIENT_ID_TEST }}
      CRM_ENTRA_CLIENT_ID_PROD: ${{ vars.CRM_ENTRA_CLIENT_ID_PROD }}
      CRM_ENABLE_POWEROFFICE: ${{ vars.CRM_ENABLE_POWEROFFICE || 'false' }}
      CRM_POWEROFFICE_ENVIRONMENT: ${{ vars.CRM_POWEROFFICE_ENVIRONMENT || 'Demo' }}
      CRM_ENABLE_ATERA: ${{ vars.CRM_ENABLE_ATERA || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CRM_ENTRA_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build SPA into crm-web wwwroot
        working-directory: web
        run: npm ci && npm run build

      - name: Resolve registry
        id: acr
        run: |
          ACR=$(az acr list -g "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          echo "server=$ACR" >> "$GITHUB_OUTPUT"
          az acr login --name "${ACR%%.*}"

      - name: Publish container images
        run: |
          for host in Crm.Web Crm.Worker; do
            dotnet publish "src/Hosts/$host/$host.csproj" -c Release -t:PublishContainer \
              --os linux --arch x64 \
              -p:ContainerRegistry=${{ steps.acr.outputs.server }} \
              -p:ContainerImageTags="$CRM_IMAGE_TAG"
          done

      - name: Run database migrations (Container Apps job inside the VNet)
        run: |
          JOB="caj-crm-migrate-$ENVIRONMENT"
          # DEV-04: crm-web and crm-worker sign in to SQL as separate identities. The worker identity is ensured here, and the
          # job told about both, so this run already creates their database users in crm_web/crm_worker before Bicep switches
          # the containers to them (Bicep keeps the same values afterwards).
          WEB_IDENTITY="id-crm-app-$ENVIRONMENT"
          WORKER_IDENTITY="id-crm-worker-$ENVIRONMENT"
          WEB_CLIENT=$(az identity show -g "$RESOURCE_GROUP" -n "$WEB_IDENTITY" --query clientId -o tsv)
          WORKER_CLIENT=$(az identity show -g "$RESOURCE_GROUP" -n "$WORKER_IDENTITY" --query clientId -o tsv 2>/dev/null || \
            az identity create -g "$RESOURCE_GROUP" -n "$WORKER_IDENTITY" --tags application=vardahei-crm environment="$ENVIRONMENT" --query clientId -o tsv)
          az containerapp job update -g "$RESOURCE_GROUP" -n "$JOB" --image "${{ steps.acr.outputs.server }}/crm-web:$CRM_IMAGE_TAG" \
            --set-env-vars "Database__WebIdentityName=$WEB_IDENTITY" "Database__WebIdentityClientId=$WEB_CLIENT" \
                           "Database__WorkerIdentityName=$WORKER_IDENTITY" "Database__WorkerIdentityClientId=$WORKER_CLIENT" \
            --remove-env-vars Database__AppIdentityName Database__AppIdentityClientId
          EXECUTION=$(az containerapp job start -g "$RESOURCE_GROUP" -n "$JOB" --query name -o tsv)
          for i in $(seq 1 90); do
            STATUS=$(az containerapp job execution show -g "$RESOURCE_GROUP" -n "$JOB" --job-execution-name "$EXECUTION" --query properties.status -o tsv)
            echo "Migration $EXECUTION: $STATUS"
            [[ "$STATUS" == "Succeeded" ]] && exit 0
            [[ "$STATUS" == "Failed" || "$STATUS" == "Stopped" ]] && exit 1
            sleep 10
          done
          echo "Migration timed out" && exit 1

      - name: Deploy infrastructure and new revisions
        run: |
          az deployment group create -g "$RESOURCE_GROUP" \
            --name "crm-$ENVIRONMENT-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters "infra/env/$ENVIRONMENT.bicepparam"

      - name: Smoke test
        run: |
          URL=$(az containerapp show -g "$RESOURCE_GROUP" -n "ca-crm-web-$ENVIRONMENT" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            curl -fsS "https://$URL/health/ready" && exit 0
            sleep 10
          done
          exit 1
